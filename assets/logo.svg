<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" fill="#0F172A"/>

  <!-- Camera body -->
  <rect x="30" y="70" width="140" height="100" rx="14" fill="none" stroke="#F97316" stroke-width="9"/>

  <!-- Lens ring outer -->
  <circle cx="100" cy="118" r="34" fill="none" stroke="#F97316" stroke-width="9"/>

  <!-- Lens ring inner -->
  <circle cx="100" cy="118" r="18" fill="#F97316" opacity="0.85"/>

  <!-- Viewfinder bump -->
  <rect x="72" y="55" width="56" height="22" rx="8" fill="#F97316"/>

  <!-- Flash dot -->
  <circle cx="148" cy="88" r="7" fill="#F97316" opacity="0.6"/>

  <!-- FP text below icon -->
</svg>
